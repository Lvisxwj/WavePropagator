experiment_name: capacity_e207_spectral_analysis
gpu_id: '1'
seed: 2026

checkpoint: ./result/model/2026_06_28_18_58_00_e2e_capacity/best.pth
train_path: ./datasets/CAVE_1024_npy
test_path: ./datasets/TSA_simu_data/Truth
mask_path: ./datasets/TSA_simu_data
output_root: ./analysis/results

num_bands: 28
shift_step: 2
analysis_batch_size: 8

# Empirical backbone finite-difference response.
impulse_epsilon: 0.02
impulse_patch_size: 32
impulse_num_scenes: 10

# Measurement-domain band removal. radius=2 means two adjacent bands per side.
occlusion_neighbor_radius: 2
occlusion_num_scenes: 10
equal_count_far_trials: 8

# E207 Capacity architecture (also checked against checkpoint config).
dim: 28
unet_stage: 2
num_blocks: [2, 4, 4]
use_sicmb: true
use_perchannel: true
post_block: ffn
ffn_mult: 4
input_mode: H
output_dc: false
dc_gamma_init: 0.30
wpo_variant: full
gradient_checkpointing: false

style:
  font_family: DejaVu Sans
  font_size: 10
  title_size: 11
  dpi: 220
  cmap_sequential: magma
  cmap_diverging: coolwarm
  color_full: '#2F5597'
  color_missing: '#C00000'
  color_near: '#70AD47'
  color_far: '#ED7D31'

