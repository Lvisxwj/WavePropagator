experiment_name: ablation_no_spectral_laplacian_244
gpu_id: '1'
seed: 2026
batch_size: 8
max_epoch: 300
learning_rate: 4.0e-4
scheduler: CosineAnnealingLR
epoch_sample: 5000
crop_size: 256
num_bands: 28
use_amp: false
grad_clip: 0.5
log_interval: 100
test_batch_size: 1
save_every: 25
save_thresh: 28.0
resume: ''

train_path: ./datasets/CAVE_1024_npy
test_path: ./datasets/TSA_simu_data/Truth
mask_path: ./datasets/TSA_simu_data

dim: 28
unet_stage: 2
num_blocks: [2, 4, 4]
use_spatial_content_modulation: true
use_perchannel: true
# Exact removal of v_lambda^2 * omega_lambda^2 from the dispersion relation.
# This does not remove every possible cross-band operation in the whole network.
use_spectral_wave: false
post_block: ffn
ffn_mult: 4
swp_variant: full
gradient_checkpointing: false
input_mode: H
output_dc: false
dc_gamma_init: 0.30


