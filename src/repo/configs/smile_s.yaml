experiment_name: smile_s
gpu_id: '1'
seed: 2026
batch_size: 4
max_epoch: 300
learning_rate: 4.0e-4
scheduler: CosineAnnealingLR
epoch_sample: 5000
crop_size: 256
num_bands: 28
use_amp: false
grad_clip: 0.5
log_interval: 100
test_batch_size: 1
test_all_outputs: true
save_every: 25
save_thresh: 28.0
resume: ''

train_path: ./datasets/CAVE_1024_npy
test_path: ./datasets/TSA_simu_data/Truth
mask_path: ./datasets/TSA_simu_data

dim: 28
unet_stage: 2
num_blocks: [2, 2, 2]
use_spatial_content_modulation: true
use_perchannel: true
use_spectral_wave: true
post_block: ffn
ffn_mult: 4
swp_variant: full
gradient_checkpointing: false
input_mode: H
input_adapter: none
output_dc: false
dc_gamma_init: 0.30
wave_param_mode: free
wave_basis_count: 3

num_field_outputs: 2
share_estimator_evolver_weights: true
return_intermediate_fields: true
field_loss_weights: [0.2, 1.0]
field_process_mode: estimate_evolve_v2



